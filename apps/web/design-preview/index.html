<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f6;--sf:#fff;--sf2:#f5f4ef;--ink:#1c2321;--mu:#6b7570;--ln:#e8e6df;--pri:#0f8f6f;--btn:#0f8f6f;--prit:#e3f5ef;--ok:#15803d;--okb:#e4f6ea;--wn:#b45309;--wnb:#fff3dc;--bd:#b91c1c;--bdb:#fdecec;--in:#1d4ed8;--inb:#e8effd;--sh:0 1px 2px rgba(28,35,33,.05),0 4px 14px rgba(28,35,33,.04);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#101412;--sf:#171c19;--sf2:#1d2320;--ink:#eef2ef;--mu:#9aa59f;--ln:#29312d;--pri:#3dd6a8;--btn:#0f8f6f;--prit:#143a2f;--ok:#58d98a;--okb:#12311f;--wn:#fbbf5c;--wnb:#35260c;--bd:#ff8f8f;--bdb:#3a1717;--in:#8fb4ff;--inb:#16284d;--sh:none}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
aside{background:var(--sf);border-right:1px solid var(--ln);padding:20px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:0 8px 20px}
.mark{width:34px;height:34px;border-radius:11px;background:var(--pri);display:grid;place-items:center;color:#fff}
.nb{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:12px;padding:10px 12px;color:var(--mu);text-align:left;font-weight:600}
.nb:hover{background:var(--sf2);color:var(--ink)}.nb.on{background:var(--prit);color:var(--pri)}
.nb .n{margin-left:auto;background:var(--wn);color:#fff;border-radius:99px;font-size:11px;padding:1px 8px}
.ic{width:19px;height:19px;flex:none}
.live{margin-top:auto;background:var(--prit);border-radius:14px;padding:12px 14px;font-size:13px}.live b{display:flex;align-items:center;gap:8px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 0 var(--pri);animation:p 2s infinite}.pulse.off{background:var(--wn);animation:none}
@keyframes p{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 32px;background:var(--bg);border-bottom:1px solid var(--ln)}
.top h1{font-size:21px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.01em}.top p{margin:0;color:var(--mu);font-size:13px}.sp{flex:1}
.pg{padding:24px 32px 48px;max-width:1240px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center}.menu{display:none}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:12px;padding:9px 16px;border:1px solid var(--ln);background:var(--sf);font-weight:600;font-size:14px}
.btn:hover{background:var(--sf2)}.btn.p{background:var(--btn);border-color:var(--btn);color:#fff}.btn.p:hover{filter:brightness(1.07)}.btn.s{padding:6px 12px;font-size:13px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:20px;box-shadow:var(--sh)}
.card h2{font-size:16px;margin:0 0 3px;font-weight:700}.sub{color:var(--mu);font-size:13px;margin:0 0 14px}.mu{color:var(--mu);font-size:13px}
.grid{display:grid;gap:16px;margin-bottom:16px}.k4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.c2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.c2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,var(--prit),var(--sf));margin-bottom:16px}
.hero h2{font-size:22px;font-weight:800;letter-spacing:-.01em}.hero .t{flex:1;min-width:240px}
.bar{height:9px;border-radius:99px;background:var(--ln);overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.kpi .v{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:4px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--prit);color:var(--pri);white-space:nowrap}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.chip.nd:before{display:none}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.wn{background:var(--wnb);color:var(--wn)}.chip.bd{background:var(--bdb);color:var(--bd)}.chip.in{background:var(--inb);color:var(--in)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}.row:first-of-type{border-top:0}.row .t{flex:1;min-width:0}.row b{font-weight:700}
.time{width:56px;font-weight:700;font-size:13px;color:var(--mu);flex:none}
.seg{display:inline-flex;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:3px}.seg button{border:0;background:none;border-radius:9px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--mu)}.seg button.on{background:var(--sf);color:var(--pri);box-shadow:var(--sh)}
label.f{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
input[type=number],input[type=text],select{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:9px 12px}
.fg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sw{position:relative;width:48px;height:28px;border-radius:99px;background:var(--ln);border:0;flex:none}.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}.sw[aria-checked=true]{background:var(--pri)}.sw[aria-checked=true]:after{transform:translateX(20px)}
.chart{width:100%;height:auto;display:block}.chart text{fill:var(--mu);font-size:11px}
.empty{text-align:center;padding:60px 20px}.empty .big{width:58px;height:58px;border-radius:18px;background:var(--prit);color:var(--pri);display:grid;place-items:center;margin:0 auto 14px}.empty p{color:var(--mu);margin:4px auto 0;max-width:420px}
.alert{border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:14px;background:var(--wnb);color:var(--wn);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1c2321;color:#fff;border-radius:12px;padding:11px 18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:92vw}#toast.on{opacity:1}
.scrim{display:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.wh{font-size:12px;font-weight:700;color:var(--mu);text-align:center;padding:4px 0}
.cd{min-height:80px;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}.cd:hover{background:var(--sf2)}.cd.td{border-color:var(--pri)}.cd.se{box-shadow:0 0 0 2px var(--pri)}.cd.em{visibility:hidden}
.cd .g{font-weight:700}.cd .h{font-size:11px;color:var(--mu)}.cd .o,.cd .s{font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cd .o{background:var(--wnb);color:var(--wn)}.cd .s{background:var(--prit);color:var(--pri)}
.cc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.cc select{width:auto}
@media(max-width:600px){.cd{min-height:52px;padding:4px}.cd .o,.cd .s{font-size:0;height:6px;width:6px;padding:0;border-radius:50%}.cd .h{display:none}}

@media(max-width:1100px){.c2,.c2e,.fg{grid-template-columns:1fr}}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:fixed;z-index:15;left:0;top:0;width:272px;transform:translateX(-100%);transition:transform .2s}
body.open aside{transform:none}body.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:14}
.menu{display:grid}.top{padding:12px 16px}.pg{padding:16px 16px 40px}.pc{display:none}.row{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

var cur="Dashboard",paused=false,cap=1500,maxPosts=3;

return '<div class="card hero"><div class="t"><div class="chip '+(paused?"wn":"")+'">'+(paused?"Autopilot paused":"Autopilot is running")+'</div><h2 style="margin:10px 0 4px">'+v.length+' actions planned today. '+d+' done'+(n?', '+n+' need you.':'.')+'</h2><div class="mu">The agent follows your rules and stops at your limits. Sample data shown.</div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'+

'<div class="grid k4">'+K.map(function(k){return '<div class="card kpi"><span class="mu">'+k[0]+'</span><div class="v">'+k[1]+'</div><span class="chip in nd" style="margin-top:6px">Sample</span></div>'}).join("")+'</div>'+
'<div class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h2>What the agent learned yesterday</h2><span class="chip in nd">Sample</span></div><p class="sub">It changes today\'s plan from real results. You can cancel any scheduled action before it runs.</p>'+["LinkedIn posts at 18:00 got 2x more clicks. Tomorrow\'s post moves to 18:00.","Posts that open with a question got more replies. The agent will use this more.","Email subjects under 40 characters opened better. The next subject is shorter."].map(function(t){return '<div class="row"><div class="t">'+t+'</div></div>'}).join("")+'</div><div class="grid c2"><div class="card"><h2>Today\'s plan</h2><p class="sub">Made by the agent this morning from your goals</p>'+(v.length?v.map(function(x){return '<div class="row"><div class="time">'+x.p.time+'</div><div class="t"><b>'+x.p.ch+'</b><div class="mu">'+x.p.task+'</div></div>'+chip(x.s[0],x.s[1])+(x.s[0]==="Scheduled"?'<button class="btn s" onclick="plan['+(x.p.id-1)+'].cx=1;toast(\'Cancelled before it ran\');render()">Cancel</button>':x.s[0]==="Cancelled"?'<button class="btn s" onclick="plan['+(x.p.id-1)+'].cx=0;toast(\'Restored\');render()">Restore</button>':"")+'</div>'}).join(""):'<div class="empty"><p>Every channel is switched off. Turn one on in Autopilot.</p></div>')+'</div>'+

function rulesPg(){
